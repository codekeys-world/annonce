services:
  db:
    container_name: db-annonce-8.0
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db-annonce
      MYSQL_USER : codekeys
      MYSQL_PASSWORD : password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - annonce_network
    restart: unless-stopped
  mail-dev:
    container_name: mail-dev-annonce
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1050:1050"
volumes:
  mysql_data:
networks:
  annonce_network:
    driver: bridge